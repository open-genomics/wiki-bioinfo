version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 站点为静态构建产物，运行时无 Node 暴露面；依赖升级以 npm audit 与 CI 构建为准。
    allow:
      - dependency-type: direct
      - dependency-type: indirect
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
